[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.pdo",
    "php82Extensions.pdo_pgsql",
    "php82Extensions.pgsql",
    "php82Extensions.mbstring",
    "php82Extensions.xml",
    "php82Extensions.bcmath",
    "php82Extensions.gd",
    "php82Extensions.zip",
    "php82Extensions.exif",
    "php82Extensions.pcntl",
    "php82Extensions.curl",
    "php82Extensions.tokenizer",
    "php82Extensions.ctype",
    "php82Extensions.fileinfo",
    "php82Extensions.intl",
    "composer"
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "php artisan key:generate --force"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=SettingsSeeder --force --no-interaction; php artisan db:seed --class=InitialAdminSeeder --force --no-interaction; php artisan config:cache; php artisan route:cache; php artisan view:cache; php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
